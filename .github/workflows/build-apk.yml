name: Build Flet Android APK

on:
  workflow_dispatch: # Allows you to trigger the build manually from GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out your code into the runner env
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up Java JDK (Required for Android Gradle compilation)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Install Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 4. Install Flet and compiler dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet

      # 5. Run the Flet build engine to generate the APK
      - name: Build Android APK
        run: |
          flet build apk --yes --include assets

      # 6. Upload the compiled APK so you can download it
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zoids-TTRPG-Tools-APK
          path: build/apk/*.apk

