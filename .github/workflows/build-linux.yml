name: Build Flet Linux Package

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest # Cloud environment matching native debian package setups

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Install precise Linux build environments
      - name: Install Linux Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet pandas

      # 2. Run the Debian package building compiler 
      - name: Build Debian Package
        run: |
          flet build deb --yes

      # 3. Upload the generated package file
      - name: Upload Debian Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zoids-TTRPG-Tools-DEB
          path: build/deb/*.deb
