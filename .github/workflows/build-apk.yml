name: Build Flet Android APK

on:
  workflow_dispatch: # Allows you to manually click "Run workflow" on your computer

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download your code (main.py, generator.py, ZoidsDB.csv) into the runner
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Java (required by the Android SDK to compile code)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Step 3: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Step 4: Install your dependencies (Flet and Pandas)
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet pandas

      # Step 5: The official Flet action compiles everything into an APK
      - name: Build Android APK
        uses: flet-dev/flet-build-action@v1
        with:
          platform: android

      # Step 6: Upload the finished APK file so you can download it from your browser
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zoids-encounter-apk
          path: build/apk/*.apk
