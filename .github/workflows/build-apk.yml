name: Build Flet Android APK

on:
  workflow_dispatch: # Allows manual computer execution triggers

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download your code (main.py, generator.py, ZoidsDB.csv, pyproject.toml)
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Allocate extra RAM boundaries to prevent silent Gradle compile crashes
      - name: Configure Gradle Memory Bounds
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m" >> ~/.gradle/gradle.properties

      # Step 3: Install Java JDK 17 (Required by the Android compiler backend)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Step 4: Install Python 3.10 for the host runner environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Step 5: Install a stable desktop compiler CLI version
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.25.2 pandas

      # Step 6: Compile the APK forcing the internal bundle to use an embedded Python 3.10 runtime
      - name: Build Android APK Package
        run: |
          flet build apk --python-version 3.10 --verbose

      # Step 7: Upload the finished installer package back to your computer browser
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zoids-encounter-apk
          path: build/apk/*.apk

