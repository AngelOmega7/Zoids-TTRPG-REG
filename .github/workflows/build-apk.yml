
name: Build Flet Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "flet==0.86.0"

      - name: Verify Configuration
        run: |
          python --version
          flet --version
          python -m pip show flet pandas
          ls -la

      - name: Build Android APK
        run: |
          flet build apk --yes \
            --include assets ZoidsDB.csv LootDB.csv \
            --verbose

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zoids-TTRPG-Tools-APK
          path: build/apk/*.apk
          if-no-files-found: error


